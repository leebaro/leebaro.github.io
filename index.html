<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>leebaro.github.io</title>
  <meta name="description" content="leebaro의 GitHub Pages 모음" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 30% 20%, #1a1410 0%, #0a0a0a 60%);
      color: #f5f5f5;
      font-family: 'Noto Sans KR', system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    main {
      max-width: 640px;
      width: 100%;
      text-align: center;
    }
    h1 {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      letter-spacing: 0.12em;
      font-size: clamp(2rem, 6vw, 3.2rem);
      margin: 0 0 8px;
    }
    .sub {
      color: #b8b8b8;
      margin: 0 0 40px;
      letter-spacing: 0.04em;
    }
    .cards {
      display: grid;
      gap: 16px;
    }
    a.card {
      display: block;
      padding: 22px 24px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: inherit;
      text-decoration: none;
      text-align: left;
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    }
    a.card:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 255, 255, 0.18);
    }
    .card-title {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: 0.08em;
      margin: 0 0 6px;
    }
    .card-desc {
      margin: 0;
      color: #c8c8c8;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    footer {
      margin-top: 40px;
      color: #777;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>leebaro</h1>
    <p class="sub">GitHub Pages</p>
    <div class="cards">
      <a class="card" href="./rip-cocktail-menu/">
        <p class="card-title">R.I.P WESTERN BAR · COCKTAIL MENU</p>
        <p class="card-desc">웨스턴 바 R.I.P의 칵테일 메뉴와 재료 구성 가이드.</p>
      </a>
    </div>
    <footer>© leebaro</footer>
  </main>
</body>
</html>
